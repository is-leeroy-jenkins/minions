<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Minions runtime workflow</title>
  <desc id="desc">Concrete text, image, and audio Minions follow a five-step provider-native runtime path with automatic tool execution.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b92d0"/><stop offset="0.52" stop-color="#a56fd1"/><stop offset="1" stop-color="#48c78e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#b46bd3"/></marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f4f7fb; }
      .eyebrow { font-size: 20px; letter-spacing: 5px; fill: #b46bd3; }
      .title { font-size: 52px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #a9b6c9; }
      .category-title { font-size: 27px; font-weight: 700; }
      .category-copy { font-size: 17px; fill: #b7c2d3; }
      .section { font-size: 25px; font-weight: 700; }
      .step-number { font-size: 22px; font-weight: 700; }
      .step-title { font-size: 23px; font-weight: 700; }
      .step-copy { font-size: 16px; fill: #a9b6c9; }
      .loop-title { font-size: 22px; font-weight: 700; fill: #cf91e8; }
      .loop-node { font-size: 20px; font-weight: 700; }
      .loop-copy { font-size: 16px; fill: #a9b6c9; }
      .result-title { font-size: 20px; font-weight: 700; font-family: Consolas, monospace; }
      .result-copy { font-size: 16px; fill: #a9b6c9; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="34" fill="url(#background)"/>
  <circle cx="1390" cy="100" r="240" fill="#673c8e" opacity="0.10"/>
  <circle cx="150" cy="760" r="250" fill="#265d8a" opacity="0.10"/>

  <text x="800" y="88" text-anchor="middle" class="title">Minions Workflow</text>
  <text x="800" y="137" text-anchor="middle" class="subtitle">Configure once · Execute natively · Keep every tool inside its provider boundary</text>

  <g transform="translate(115 215)">
    <g>
      <rect width="430" height="142" rx="22" fill="#111c2e" stroke="#3b92d0" stroke-width="2"/>
      <rect y="134" width="430" height="8" rx="4" fill="#3b92d0"/>
      <circle cx="52" cy="48" r="25" fill="#3b92d0"/><text x="52" y="56" text-anchor="middle" font-size="21" font-weight="700">T</text>
      <text x="92" y="54" class="category-title">Text Minions</text>
      <text x="30" y="96" class="category-copy">Research · Writing · Compliance · Business</text>
      <text x="30" y="120" class="category-copy">Coding · Data · Governance · Planning</text>
    </g>
    <g transform="translate(470)">
      <rect width="430" height="142" rx="22" fill="#111c2e" stroke="#b46bd3" stroke-width="2"/>
      <rect y="134" width="430" height="8" rx="4" fill="#b46bd3"/>
      <circle cx="52" cy="48" r="25" fill="#b46bd3"/><text x="52" y="56" text-anchor="middle" font-size="21" font-weight="700">I</text>
      <text x="92" y="54" class="category-title">Image Minions</text>
      <text x="30" y="99" class="category-copy">Generation · Analysis · Editing</text>
    </g>
    <g transform="translate(940)">
      <rect width="430" height="142" rx="22" fill="#111c2e" stroke="#48c78e" stroke-width="2"/>
      <rect y="134" width="430" height="8" rx="4" fill="#48c78e"/>
      <circle cx="52" cy="48" r="25" fill="#48c78e"/><text x="52" y="56" text-anchor="middle" font-size="21" font-weight="700">A</text>
      <text x="92" y="54" class="category-title">Audio Minions</text>
      <text x="30" y="99" class="category-copy">Translation · Transcription · Speech</text>
    </g>
  </g>

  <text x="800" y="417" text-anchor="middle" class="section">Runtime Path</text>
  <line x1="190" y1="482" x2="1410" y2="482" stroke="url(#timeline)" stroke-width="5"/>

  <g>
    <g transform="translate(220 482)">
      <circle r="44" fill="#13283e" stroke="#3b92d0" stroke-width="4" filter="url(#glow)"/>
      <text y="8" text-anchor="middle" class="step-number">01</text>
      <text y="76" text-anchor="middle" class="step-title">Select</text>
      <text y="104" text-anchor="middle" class="step-copy">Provider module</text><text y="126" text-anchor="middle" class="step-copy">+ concrete Minion</text>
    </g>
    <g transform="translate(510 482)">
      <circle r="44" fill="#18302d" stroke="#31b58c" stroke-width="4" filter="url(#glow)"/>
      <text y="8" text-anchor="middle" class="step-number">02</text>
      <text y="76" text-anchor="middle" class="step-title">Configure</text>
      <text y="104" text-anchor="middle" class="step-copy">Model + instructions</text><text y="126" text-anchor="middle" class="step-copy">+ optional tools</text>
    </g>
    <g transform="translate(800 482)">
      <circle r="44" fill="#2a2037" stroke="#b46bd3" stroke-width="4" filter="url(#glow)"/>
      <text y="8" text-anchor="middle" class="step-number">03</text>
      <text y="76" text-anchor="middle" class="step-title">Execute</text>
      <text y="104" text-anchor="middle" class="step-copy">run · run_async</text><text y="126" text-anchor="middle" class="step-copy">· stream</text>
    </g>
    <g transform="translate(1090 482)">
      <circle r="44" fill="#382918" stroke="#e0a13a" stroke-width="4" filter="url(#glow)"/>
      <text y="8" text-anchor="middle" class="step-number">04</text>
      <text y="76" text-anchor="middle" class="step-title">Resolve</text>
      <text y="104" text-anchor="middle" class="step-copy">Hosted tool or</text><text y="126" text-anchor="middle" class="step-copy">local function</text>
    </g>
    <g transform="translate(1380 482)">
      <circle r="44" fill="#173329" stroke="#48c78e" stroke-width="4" filter="url(#glow)"/>
      <text y="8" text-anchor="middle" class="step-number">05</text>
      <text y="76" text-anchor="middle" class="step-title">Return</text>
      <text y="104" text-anchor="middle" class="step-copy">Native response</text><text y="126" text-anchor="middle" class="step-copy">or stream</text>
    </g>
  </g>

  <g transform="translate(315 660)">
    <rect width="970" height="156" rx="35" fill="#121a2c" stroke="#7f5fb8" stroke-width="2"/>
    <text x="485" y="36" text-anchor="middle" class="loop-title">AGENT TOOL LOOP</text>
    <rect x="45" y="60" width="240" height="68" rx="13" fill="#192339"/>
    <text x="165" y="87" text-anchor="middle" class="loop-node">Model</text><text x="165" y="111" text-anchor="middle" class="loop-copy">requests a tool</text>
    <line x1="300" y1="94" x2="350" y2="94" stroke="#b46bd3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="365" y="60" width="240" height="68" rx="13" fill="#192339"/>
    <text x="485" y="87" text-anchor="middle" class="loop-node">Provider / Minion</text><text x="485" y="111" text-anchor="middle" class="loop-copy">executes the tool</text>
    <line x1="620" y1="94" x2="670" y2="94" stroke="#b46bd3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="685" y="60" width="240" height="68" rx="13" fill="#192339"/>
    <text x="805" y="87" text-anchor="middle" class="loop-node">Model</text><text x="805" y="111" text-anchor="middle" class="loop-copy">continues to final answer</text>
  </g>

  <g transform="translate(205 858)">
    <g><rect width="360" height="88" rx="16" fill="#11251f" stroke="#48c78e"/><text x="28" y="38" class="result-title">run</text><text x="28" y="65" class="result-copy">Synchronous result</text></g>
    <g transform="translate(415)"><rect width="360" height="88" rx="16" fill="#11251f" stroke="#48c78e"/><text x="28" y="38" class="result-title">run_async</text><text x="28" y="65" class="result-copy">Awaitable result</text></g>
    <g transform="translate(830)"><rect width="360" height="88" rx="16" fill="#11251f" stroke="#48c78e"/><text x="28" y="38" class="result-title">stream</text><text x="28" y="65" class="result-copy">Native stream or iterator</text></g>
  </g>
</svg>
