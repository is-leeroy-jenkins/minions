[build-system]
requires = [ "setuptools>=77", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "minions"
version = "0.1.0"
description = "Reusable provider-specific AI workflow agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents",
]

[project.urls]
Repository = "https://github.com/is-leeroy-jenkins/minions"

[tool.setuptools]
packages = [
    "minions",
    "minions.claude",
    "minions.gemini",
    "minions.gpt",
    "minions.grok",
    "minions.mistral",
]

[tool.setuptools.package-dir]
minions = "."
"minions.claude" = "claude"
"minions.gemini" = "gemini"
"minions.gpt" = "gpt"
"minions.grok" = "grok"
"minions.mistral" = "mistral"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
