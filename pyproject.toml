[build-system]
requires = [ "setuptools>=77", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "minions"
version = "0.2.0"
description = "Reusable provider-specific AI workflow agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4,<2",
    "google-adk>=2.8,<3",
    "mistralai[agents]>=2.9,<3",
    "openai-agents>=0.22,<1",
    "xai-sdk>=1.19,<2",
]

[project.urls]
Repository = "https://github.com/is-leeroy-jenkins/minions"

[tool.setuptools]
packages = [ "minions" ]

[tool.setuptools.package-dir]
minions = "."

[tool.pytest.ini_options]
testpaths = [ "tests" ]
